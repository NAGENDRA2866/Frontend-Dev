<!DOCTYPE html>
<html>
<head>
  <title>Form with Iframe Result</title>
</head>
<body>

  <h2>Simple Form</h2>

  <!-- Form submits to result.html and loads inside the iframe -->
  <form action="result.html" method="get" target="resultFrame">
    <label for="name">Enter your name:</label><br>
    <input type="text" id="name" name="name" required><br><br>
    <input type="submit" value="Submit">
  </form>

  <br>

  <!-- Iframe where result.html will be displayed -->
  <iframe name="resultFrame" width="80%" height="100" title="Form Result"></iframe>

</body>
</html>
