<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Responsive Image Filter Gallery</title>
  <link rel="stylesheet" href="file1.css">
</head>
<body>
  <header><h1>Image Filter Gallery</h1></header>
  <main class="gallery">
    <figure><img src="https://via.placeholder.com/200" class="blur"><figcaption>Blur</figcaption></figure>
    <figure><img src="https://via.placeholder.com/200" class="grayscale"><figcaption>Grayscale</figcaption></figure>
    <figure><img src="https://via.placeholder.com/200" class="sepia"><figcaption>Sepia</figcaption></figure>
    <figure><img src="https://via.placeholder.com/200" class="brightness"><figcaption>Brightness</figcaption></figure>
    <figure><img src="https://via.placeholder.com/200" class="contrast"><figcaption>Contrast</figcaption></figure>
    <figure><img src="https://via.placeholder.com/200" class="hue"><figcaption>Hue Rotate</figcaption></figure>
  </main>
</body>
</html>
