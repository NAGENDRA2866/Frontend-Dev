<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Pseudo-Classes Demo</title>
  <link rel="stylesheet" href="file1.css">
</head>
<body>
  <header><h1>Pseudo-Classes Demonstration</h1></header>
  <main class="container">
    <section class="example">
      <a href="#">Hover Link</a>
      <p>:hover changes color when mouse is over it.</p>
    </section>
    <section class="example">
      <button>Click Me</button>
      <p>:active triggers on button press.</p>
    </section>
    <section class="example">
      <input type="text" placeholder="Focus here">
      <p>:focus activates when input is clicked.</p>
    </section>
    <ul class="example-list">
      <li>First Item</li>
      <li>Second Item</li>
      <li>Third Item</li>
      <li>Fourth Item</li>
    </ul>
    <p>:nth-child() styles every even list item.</p>
  </main>
</body>
</html>
