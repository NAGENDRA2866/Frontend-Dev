<!doctype html>
<html>
<head>
  <meta charset="utf-8" />
  <title>Q10 - Registration Form Validation</title>
  <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
  <script src="./q10_registration_validation.js"></script>
  <style>.error{color:#a00}.valid{border:1px solid green}</style>
</head>
<body>
  <h1>Q10 - Registration Form Validation</h1>
  <form id="reg">
    <div>Name: <input id="name" name="name" /></div>
    <div>Email: <input id="email" name="email" /></div>
    <div>Password: <input id="password" name="password" type="password" /></div>
    <button type="submit">Register</button>
  </form>
  <div id="msg"></div>
</body>
</html>
