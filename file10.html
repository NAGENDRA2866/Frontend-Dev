<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Complete Website</title>
  <link rel="stylesheet" href="file10.css">
</head>
<body>
  <header>
    <h1>My Webpage</h1>
    <nav>
      <a href="#">Home</a>
      <a href="#">About</a>
      <a href="#">Services</a>
      <a href="#">Contact</a>
    </nav>
  </header>

  <section class="hero">
    <h2>Welcome to My Website</h2>
  </section>

  <section class="about">
    <div class="text">
      <h2>About Me</h2>
      <p>I am a web developer who loves designing modern, responsive websites.</p>
    </div>
    <img src="about.jpg" alt="About Image">
  </section>

  <section class="services">
    <div class="box">Web Design</div>
    <div class="box">Development</div>
    <div class="box">SEO</div>
  </section>

  <section class="contact">
    <form>
      <input type="text" placeholder="Name" required>
      <input type="email" placeholder="Email" required>
      <button>Submit</button>
    </form>
  </section>

  <footer>
    <p>&copy; 2025 My Website</p>
  </footer>
</body>
</html>
