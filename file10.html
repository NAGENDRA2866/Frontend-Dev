<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Travel Agency Showcase</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>

  <header class="bg-primary text-white text-center py-3">
    <h2>Explore The World With Us</h2>
  </header>

  <div id="travelCarousel" class="carousel slide" data-bs-ride="carousel">
    <div class="carousel-inner">
      <div class="carousel-item active" data-bs-interval="3000">
        <img src="https://picsum.photos/1200/400?1" class="d-block w-100">
        <div class="carousel-caption"><h5>Paris</h5></div>
      </div>
      <div class="carousel-item" data-bs-interval="3000">
        <img src="https://picsum.photos/1200/400?2" class="d-block w-100">
        <div class="carousel-caption"><h5>Maldives</h5></div>
      </div>
      <div class="carousel-item" data-bs-interval="3000">
        <img src="https://picsum.photos/1200/400?3" class="d-block w-100">
        <div class="carousel-caption"><h5>Switzerland</h5></div>
      </div>
    </div>
  </div>

  <div class="container my-5">
    <h4>Booking Progress</h4>
    <div class="progress">
      <div class="progress-bar progress-bar-striped progress-bar-animated" style="width:70%">70%</div>
    </div>
  </div>

  <footer class="bg-dark text-white text-center py-3">
    <p>Contact us: travel@example.com | +91 98765 43210</p>
  </footer>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
