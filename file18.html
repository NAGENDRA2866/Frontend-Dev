<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>Quotations Example</title>
</head>
<body>

  <h2>Quotations in HTML</h2>

  <!-- Long quote using blockquote -->
  <blockquote>
    "The only limit to our realization of tomorrow is our doubts of today. 
    Remember, learning & practicing consistently leads to success."
  </blockquote>

  <!-- Paragraph with short quote using q and an HTML entity -->
  <p>
    As Albert Einstein once said, <q>Imagination is more important than knowledge & creativity combined.</q>
  </p>

</body>
</html>
