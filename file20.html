<!DOCTYPE html>
<html lang="en">
<head>
  <!-- The title of the webpage, displayed in browser tab -->
  <title>Complete Head Elements Example</title>

  <!-- Character encoding for proper display of text -->
  <meta charset="UTF-8">

  <!-- Short description of the page for search engines -->
  <meta name="description" content="This page demonstrates all important head elements in HTML">

  <!-- Author of the webpage -->
  <meta name="author" content="Mirthipati Nagendra">

  <!-- Base URL for all relative URLs on the page -->
  <base href="https://www.example.com/">

  <!-- Link to a favicon or other external resource -->
  <link rel="icon" href="favicon.ico" type="image/x-icon">

  <!-- Internal CSS style block (can be empty) -->
  <style>
    /* CSS rules go here */
  </style>

  <!-- JavaScript block (can be empty) -->
  <script>
    // JavaScript code goes here
  </script>
</head>
<body>

  <h2>HTML Head Elements Demonstration</h2>
  <p>This page shows how to use title, meta, base, link, style, and script tags inside the head section.</p>

</body>
</html>
