<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Pricing Plans</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="file8.css">
</head>
<body>

  <div class="container text-center py-5">
    <h2 class="mb-4">Choose Your Plan</h2>
    <div class="row g-4">
      <div class="col-md-4">
        <div class="card shadow-sm p-3">
          <h4>Basic</h4>
          <p>$10/month</p>
          <ul class="list-unstyled">
            <li>✔ 10 Projects</li>
            <li>✔ 5 GB Storage</li>
          </ul>
          <button class="btn btn-outline-primary">Select</button>
        </div>
      </div>

      <div class="col-md-4">
        <div class="card bg-primary text-white shadow-lg p-3">
          <h4>Pro</h4>
          <p>$25/month</p>
          <ul class="list-unstyled">
            <li>✔ 50 Projects</li>
            <li>✔ 25 GB Storage</li>
          </ul>
          <button class="btn btn-light">Select</button>
        </div>
      </div>

      <div class="col-md-4">
        <div class="card shadow-sm p-3">
          <h4>Enterprise</h4>
          <p>$50/month</p>
          <ul class="list-unstyled">
            <li>✔ Unlimited Projects</li>
            <li>✔ 100 GB Storage</li>
          </ul>
          <button class="btn btn-outline-primary">Select</button>
        </div>
      </div>
    </div>
  </div>

</body>
</html>
