<!doctype html>
<html>
<head>
  <meta charset="utf-8" />
  <title>Q4 - Theme Switcher</title>
  <style>
    body[data-theme="light"]{ background:#fff; color:#000 }
    body[data-theme="dark"]{ background:#222; color:#eee }
    body[data-theme="blue"]{ background:#e6f0ff; color:#003366 }
    .btn{margin-right:8px}
  </style>
</head>
<body data-theme="light">
  <h1>Q4 - Theme Switcher</h1>
  <button class="btn" data-theme="light">Light</button>
  <button class="btn" data-theme="dark">Dark</button>
  <button class="btn" data-theme="blue">Blue</button>

  <script>
    (function(){
      document.querySelectorAll('button[data-theme]').forEach(btn => {
        btn.addEventListener('click', ()=>{
          document.body.setAttribute('data-theme', btn.getAttribute('data-theme'));
          document.body.setAttribute('data-theme-last', btn.getAttribute('data-theme'));
        });
      });
    })();
  </script>
</body>
</html>
