<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Restaurant Menu</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="file4.css">
</head>
<body class="bg-light">

  <header class="text-center p-4 bg-dark text-white">
    <h2>Today's Menu</h2>
  </header>

  <main class="container my-4">
    <img src="https://picsum.photos/800/300?food" class="img-fluid mb-3 rounded" alt="Food">
    <p class="lead text-center">Delicious dishes prepared by our top chefs.</p>

    <table class="table table-striped text-center">
      <thead class="table-dark">
        <tr><th>Category</th><th>Item</th><th>Price</th></tr>
      </thead>
      <tbody>
        <tr><td>Starters</td><td>Garlic Bread</td><td>$5</td></tr>
        <tr><td>Main Course</td><td>Grilled Chicken</td><td>$15</td></tr>
        <tr><td>Dessert</td><td>Chocolate Cake</td><td>$7</td></tr>
      </tbody>
    </table>

    <h4 class="mt-5 text-center">Chef’s Specials</h4>
    <ul class="list-group text-center">
      <li class="list-group-item">Spicy Prawn Curry</li>
      <li class="list-group-item">Beef Wellington</li>
    </ul>
  </main>

  <footer class="text-center py-3 bg-dark text-white">
    &copy; 2025 The Food Corner
  </footer>

</body>
</html>
