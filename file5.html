<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Blog Homepage</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="file5.css">
</head>
<body>

  <header class="bg-primary text-white text-center py-4">
    <h1>My Travel Blog</h1>
    <p>Exploring the world, one city at a time</p>
  </header>

  <main class="container my-5">
    <div class="row g-4">
      <div class="col-md-6">
        <div class="card shadow-sm">
          <img src="https://picsum.photos/600/300?1" class="card-img-top">
          <div class="card-body">
            <h5 class="card-title text-primary">Paris Adventures</h5>
            <p>Exploring art, food, and culture in the heart of France.</p>
          </div>
        </div>
      </div>

      <div class="col-md-6">
        <div class="card shadow-sm">
          <img src="https://picsum.photos/600/300?2" class="card-img-top">
          <div class="card-body">
            <h5 class="card-title text-primary">Tokyo Nights</h5>
            <p>Lights, sushi, and tech vibes in Japan’s capital.</p>
          </div>
        </div>
      </div>
    </div>
  </main>

  <footer class="text-center bg-light py-3">
    <small>© 2025 My Travel Blog</small>
  </footer>

</body>
</html>
