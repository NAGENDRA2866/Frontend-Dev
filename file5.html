<!doctype html>
<html>
<head>
  <meta charset="utf-8" />
  <title>Q5 - Image Gallery with Modal Preview</title>
  <style>
    body{font-family:Segoe UI,Arial;margin:16px}
    .grid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
    .grid img{width:100%;cursor:pointer}
    .modal{position:fixed;inset:0;background:rgba(0,0,0,0.6);display:flex;align-items:center;justify-content:center;visibility:hidden}
    .modal.show{visibility:visible}
    .modal img{max-width:90%;max-height:90%}
  </style>
</head>
<body>
  <h1>Q5 - Image Gallery</h1>
  <div class="grid" id="grid"></div>
  <div class="modal" id="modal"><img id="modalImg"><div></div></div>

  <script>
    (function(){
      const grid = document.getElementById('grid');
      const modal = document.getElementById('modal');
      const modalImg = document.getElementById('modalImg');
      const urls = [1,2,3,4,5,6].map(i => `https://via.placeholder.com/400x300?text=Img+${i}`);
      urls.forEach(u => { const img = document.createElement('img'); img.src = u; img.alt=''; grid.appendChild(img); });

      grid.addEventListener('click', (e)=>{
        if(e.target.tagName === 'IMG'){
          modalImg.src = e.target.src; modal.classList.add('show');
        }
      });

      // close when clicking outside image
      modal.addEventListener('click', ()=> modal.classList.remove('show'));
      // prevent close when clicking the image
      modalImg.addEventListener('click', (e)=> e.stopPropagation());
    })();
  </script>
</body>
</html>
