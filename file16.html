<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>URI Encoding Example</title>
</head>
<body>

  <h2>URI Encoding Demonstration</h2>

  <p>
    Original URL (contains spaces and special characters):<br>
    https://example.com/search?query=HTML & CSS
  </p>

  <p>
    Correctly encoded URL:<br>
    <a href="https://example.com/search?query=HTML%20%26%20CSS" target="_blank">
      https://example.com/search?query=HTML%20%26%20CSS
    </a>
  </p>

  <p>
    Here, <code>%20</code> represents a space and <code>%26</code> represents the “&” symbol.
  </p>

</body>
</html>
