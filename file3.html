<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Product Catalog</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="file3.css">
</head>
<body>
  <div class="container py-5">
    <h2 class="text-center mb-4">Our Products</h2>
    <div class="row g-4">
      <!-- Product Card -->
      <div class="col-12 col-md-6 col-lg-3">
        <div class="card shadow-sm text-center">
          <img src="https://picsum.photos/200?1" class="card-img-top" alt="">
          <div class="card-body">
            <h5>Product 1</h5>
            <p>$25</p>
            <button class="btn btn-primary">Add to Cart</button>
          </div>
        </div>
      </div>

      <!-- Repeat 3 more -->
      <div class="col-12 col-md-6 col-lg-3">
        <div class="card shadow-sm text-center">
          <img src="https://picsum.photos/200?2" class="card-img-top">
          <div class="card-body">
            <h5>Product 2</h5>
            <p>$30</p>
            <button class="btn btn-primary">Add to Cart</button>
          </div>
        </div>
      </div>

      <div class="col-12 col-md-6 col-lg-3">
        <div class="card shadow-sm text-center">
          <img src="https://picsum.photos/200?3" class="card-img-top">
          <div class="card-body">
            <h5>Product 3</h5>
            <p>$40</p>
            <button class="btn btn-primary">Add to Cart</button>
          </div>
        </div>
      </div>

      <div class="col-12 col-md-6 col-lg-3">
        <div class="card shadow-sm text-center">
          <img src="https://picsum.photos/200?4" class="card-img-top">
          <div class="card-body">
            <h5>Product 4</h5>
            <p>$50</p>
            <button class="btn btn-primary">Add to Cart</button>
          </div>
        </div>
      </div>
    </div>
  </div>
</body>
</html>
