<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Multilingual Webpage</title>
</head>
<body>

  <h2>Multilingual Text Example</h2>

  <p>
    <strong>English:</strong> Welcome to my website!<br>
    <strong>हिंदी (Hindi):</strong> मेरे वेबसाइट पर आपका स्वागत है!<br>
    <strong>Français (French):</strong> Bienvenue sur mon site web !
  </p>

</body>
</html>
