<!DOCTYPE html>
<html>
<head>
  <title>HTML Entities Example</title>
</head>
<body>

  <h2>HTML Entities Example</h2>

  <p>
    Displaying special characters using HTML entities:<br><br>
    &lt; = Less than sign<br>
    &gt; = Greater than sign<br>
    &amp; = Ampersand<br>
    &quot; = Double quote<br>
    &apos; = Single quote<br><br>
    &copy; = Copyright symbol<br>
    &trade; = Trademark symbol<br>
    &reg; = Registered trademark symbol
  </p>

</body>
</html>
