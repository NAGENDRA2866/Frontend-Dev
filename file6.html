<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Notifications Dashboard</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">

  <div class="container my-5">
    <h2 class="text-center mb-4">User Notifications</h2>

    <div class="card p-4">
      <div class="alert alert-success">✅ New message received!</div>
      <div class="alert alert-info">💡 Tip: Update your profile today.</div>
      <div class="alert alert-danger alert-dismissible fade show" role="alert">
        ⚠️ Warning: Password expires soon.
        <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
      </div>

      <div class="bg-light border rounded p-3 mt-3">
        <h6>Summary</h6>
        <p>You have 2 unread messages and 1 pending task.</p>
      </div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
