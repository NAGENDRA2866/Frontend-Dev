<!doctype html>
<html>
<head>
  <meta charset="utf-8" />
  <title>Q6 - Real-Time Table Filter</title>
  <style>body{font-family:Segoe UI,Arial;margin:16px} table{width:100%;border-collapse:collapse} th,td{border:1px solid #ddd;padding:6px;text-align:left} #nores{display:none;color:#a00}</style>
</head>
<body>
  <h1>Q6 - Real-Time Table Filter</h1>
  <input id="search" placeholder="Search name or branch" />
  <div id="nores">No results found</div>
  <table id="tbl">
    <thead><tr><th>Name</th><th>Branch</th><th>CGPA</th></tr></thead>
    <tbody></tbody>
  </table>

  <script>
    (function(){
      const students = [
        ['Amit','CS',8.5],['Sara','EE',7.2],['Kiran','ME',6.8],['Ravi','CS',9.0],['Mina','EE',8.1]
      ];
      const tbody = document.querySelector('#tbl tbody');
      function render(list){
        tbody.innerHTML = '';
        list.forEach(s => { const tr = document.createElement('tr'); tr.innerHTML = `<td>${s[0]}</td><td>${s[1]}</td><td>${s[2]}</td>`; tbody.appendChild(tr); });
      }
      render(students);
      const search = document.getElementById('search'); const nores = document.getElementById('nores');
      search.addEventListener('input', ()=>{
        const q = search.value.trim().toLowerCase();
        if(!q){ render(students); nores.style.display='none'; return; }
        const filtered = students.filter(s => s[0].toLowerCase().includes(q) || s[1].toLowerCase().includes(q));
        if(filtered.length === 0){ tbody.innerHTML=''; nores.style.display='block'; }
        else { render(filtered); nores.style.display='none'; }
      });
    })();
  </script>
</body>
</html>
