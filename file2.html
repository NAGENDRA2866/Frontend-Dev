<!doctype html>
<html>
<head>
  <meta charset="utf-8" />
  <title>Q2 - Product Highlight</title>
  <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
  <script src="./q2_product_highlight.js"></script>
  <style>.product{padding:8px;border:1px solid #ddd;margin:6px;display:inline-block;width:150px;vertical-align:top}.highlight{background:yellow}.discount{color:red}</style>
</head>
<body>
  <h1>Q2 - Product Highlight</h1>
  <div id="products">
    <div class="product" data-stock="10" data-discount="true">Product A <div class="discount">-10%</div></div>
    <div class="product" data-stock="0">Product B <div class="discount">Out of stock</div></div>
    <div class="product" data-stock="5">Product C</div>
    <div class="product" data-stock="2" data-discount="true">Product D <div class="discount">-5%</div></div>
    <div class="product" data-stock="7">Product E</div>
  </div>
</body>
</html>
