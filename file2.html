<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Portfolio</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="file2.css">
</head>
<body class="bg-light">

  <header class="text-center mt-4">
    <h1 class="fw-bold">John Doe</h1>
    <p class="text-secondary">Web Developer & Designer</p>
  </header>

  <main class="container text-center p-5">
    <img src="https://picsum.photos/200" class="img-fluid rounded-circle mb-4" alt="Profile">
    <div>
      <button class="btn btn-primary me-2">Hire Me</button>
      <button class="btn btn-outline-secondary">Download CV</button>
    </div>

    <form class="mt-4">
      <input type="text" class="form-control mb-3" placeholder="Your Name">
      <input type="email" class="form-control mb-3" placeholder="Your Email">
      <textarea class="form-control mb-3" placeholder="Message"></textarea>
      <button class="btn btn-success">Send Message</button>
    </form>
  </main>

</body>
</html>
